name: ft_transcendence

x-logging: &default-logging # 디스크 용량 고갈 방지 (Log Rotation)
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-ulimit: &default-ulimit
  nofile:
    soft: 65535
    hard: 65535

services:
  chat-store:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    stop_grace_period: 20s # 컨테이너 종료 시 AOF 플러시 완료를 기다려주는 안전 유예 시간

    command:
      ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]

    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?}

    volumes:
      - ./redis/chat-store.conf:/usr/local/etc/redis/redis.conf:ro
      - chat-store-data:/data:rw

    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - internal-network
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG || exit 1']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging: *default-logging

    ulimits: *default-ulimit
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1800M
        reservations:
          memory: 256M

  db:
    image: mysql:8.0
    restart: unless-stopped
    stop_grace_period: 1m

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=256M
      - --max-connections=60

    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?}
      - MYSQL_USER=${DB_USERNAME:?}
      - MYSQL_PASSWORD=${DB_PASSWORD:?}
      - MYSQL_DATABASE=${DB_SCHEMA_NAME:?}
      - TZ=UTC

    volumes:
      - mysql-data:/var/lib/mysql

    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - internal-network
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_PASSWORD" mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

    ulimits: *default-ulimit
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M

volumes:
  chat-store-data:
    driver: local
  mysql-data:
    driver: local

# internal-network는 프로덕션 환경에서는 `internal: true` 옵션 활성화하여 외부 접근 차단 필수
networks:
  internal-network:
    driver: bridge
