name: ft_transcendence

services:
  mysql:
    image: mysql:8.4
    container_name: ft_transcendence_mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-your_password}"
      MYSQL_DATABASE: "${DB_SCHEMA_NAME:-ft_transcendence}"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: ft_transcendence_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  adminer:
    image: adminer:latest
    container_name: ft_transcendence_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  mysql_data:
  redis_data:
