## [네트워크 및 보안]

bind 0.0.0.0
protected-mode yes
port 6379

# OS 계층 좀비 커넥션 감지 및 정리
tcp-keepalive 60

# 애플리케이션 계층 유휴 연결 유지
timeout 0

tcp-backlog 511
maxclients 10000

io-threads 1

# 프로덕션 위험/블로킹 명령어 차단
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command DEBUG ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
rename-command SAVE ""
rename-command MODULE ""
rename-command REPLICAOF ""
rename-command SLAVEOF ""

## [기본 서버/저장소 설정]

# 데이터 저장 디렉터리 명시적 고정
dir /data

# 멀티 DB 안티패턴 차단 (단일 DB 강제)
databases 1

## [메모리 관리]

# 메모리 상한선 및 방출 정책 (채팅 버퍼 데이터 무결성 보장)
maxmemory 1000mb
maxmemory-policy noeviction

# jemalloc 런타임 메모리 단편화 자동 정리 (OOM 방어)
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 30
active-defrag-cycle-min 5
active-defrag-cycle-max 50

## [비동기 메모리 해제 (Latency Spike 방지)]
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

## [지속성 (AOF 전용, RDB 차단)]

# RDB 스냅샷 비활성화
save ""

appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# AOF Rewrite 시 4MB 단위 점진적 fsync (디스크 I/O 스파이크 방지)
# default
aof-rewrite-incremental-fsync yes

# default
aof-load-truncated yes

## [클라이언트 버퍼 제한 (채팅 트래픽 폭증 방어)]
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit pubsub 32mb 8mb 60

## [장애 분석 및 지연 시간 모니터링]

loglevel notice
logfile ""

# 10ms(10,000us) 이상 지연된 쿼리 로깅
slowlog-log-slower-than 10000

slowlog-max-len 1024

# redis 엔진 내부에서 발생한 작업 중 100ms 이상 지연된 작업 로깅
latency-monitor-threshold 100
