worker_processes 2;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 임시 버퍼 디렉터리 경로 지정
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;

    # 사용하지 않더라도 read_only 컨테이너 부팅 에러 방지를 위해 필수 선언
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # 성능 기본값
    sendfile on;
    tcp_nopush on;  # 패킷을 잘게 쪼개어 바로 보내지 않고, MSS가 꽉 찰때까지 모았다가 한번에 전송
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # 정적 파일 디스크립터(FD) 메모리 캐싱
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off; # default

    client_max_body_size 2M;
    client_body_buffer_size 1M;

    # 대용량 파일 업로드 타임아웃 여유 확보
    client_body_timeout 120s;
    client_header_timeout 60s;

    # Gzip 압축 (Node.js CPU 부하를 NGINX로 오프로딩)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024; # 1KB 미만 파일은 압축 생략 (오버헤드 방지)
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # API 레이트 리밋 존 정의 (IP당 초당 30회 허용, 초과 요청은 버스트 큐 수용)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # AI 레이트 리밋 존 정의 (IP당 분당 6회(10초당 1회) 허용)
    limit_req_zone $binary_remote_addr zone=ai_limit:2m rate=6r/m;

    # 파일 업로드 전용 존 (I/O, 대역폭, Sharp 이미지 리사이징 부하 방어)
    limit_req_zone $binary_remote_addr zone=upload_limit:2m rate=2r/s;

    limit_req_status 429;

    # WebSocket Upgrade 헤더 매핑 (일반 요청 시 빈 문자열 전달하여 Keepalive 유지)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # path: 디스크 저장 경로
    # levels=1:2 : 캐시 파일이 저장될 2단계 디렉터리 분할 구조 (디스크 탐색 속도 최적화)
    # keys_zone=NEXT_STATIC:10m : 캐시 메타데이터용 공유 메모리 10MB 할당 (약 8만 개 URL 인덱싱 가능)
    # max_size=1g : 캐시 디스크 총 용량 한도
    # inactive=365d : 365일 동안 한 번도 조회가 없으면 디스크에서 삭제
    proxy_cache_path /var/cache/nginx/next_static levels=1:2 keys_zone=NEXT_STATIC:10m max_size=200m inactive=365d use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
