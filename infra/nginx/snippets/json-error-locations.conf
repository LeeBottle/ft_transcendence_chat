# JSON 에러 응답 전용 Named Location 선언

# NestJS의 기본 내장 예외 필터(HttpExceptionFilter)가 생성하는 표준 에러 응답 객체(Standard Error Response Schema)의 규격 JSON 반환
# NestJS에서 커스텀 필터 및 포맷 사용시 아래 포맷도 업데이트 필요

location @json_api_error_403 {
    default_type application/json;
    return 403 '{"statusCode": 403, "error": "Forbidden", "code": "FORBIDDEN", "message": "Access to this resource is denied.", "path": "$uri", "timestamp": "$time_iso8601"}';
}

location @json_api_error_413 {
    default_type application/json;
    return 413 '{"statusCode": 413, "error": "Payload Too Large", "code": "PAYLOAD_TOO_LARGE", "message": "Request payload exceeds the allowable limit.", "path": "$uri", "timestamp": "$time_iso8601"}';
}

location @json_api_error_429 {
    default_type application/json;
    return 429 '{"statusCode": 429, "error": "Too Many Requests", "code": "TOO_MANY_REQUESTS", "message": "Rate limit exceeded. Please try again later.", "path": "$uri", "timestamp": "$time_iso8601"}';
}

location @json_api_error_502 {
    default_type application/json;
    return 502 '{"statusCode": 502, "error": "Bad Gateway", "code": "BAD_GATEWAY", "message": "Failed to communicate with the backend service.", "path": "$uri", "timestamp": "$time_iso8601"}';
}

location @json_api_error_503 {
    default_type application/json;
    return 503 '{"statusCode": 503, "error": "Service Unavailable", "code": "SERVICE_UNAVAILABLE", "message": "The service is temporarily unavailable. Please try again later.", "path": "$uri", "timestamp": "$time_iso8601"}';
}

location @json_api_error_504 {
    default_type application/json;
    return 504 '{"statusCode": 504, "error": "Gateway Timeout", "code": "GATEWAY_TIMEOUT", "message": "The backend service failed to respond in time.", "path": "$uri", "timestamp": "$time_iso8601"}';
}
