# Upstream Keepalive 커넥션 풀 설정

upstream web_service {
    server web:3000;
    keepalive 32; # 유휴 TCP 연결 32개 유지
}

upstream api_service {
    server api:4000;
    keepalive 32;
}

# HTTP(호스트 80 / 컨테이너 8080) -> HTTPS(호스트 443) 영구 리다이렉트
server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    # 도커 내부 헬스체크 전용
    location = /healthz {
        default_type text/plain;
        return 200 'OK';
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 강력한 암호화 스위트 지정 (취약한 CBC, RC4, DES 제외)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # TLS 1.3 최신 권장사항 (클라이언트가 최적 암호 선택하도록 위임)
    ssl_prefer_server_ciphers off;

    # 키 교환 타원곡선 최적화 (X25519 우선)
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    # 세션 재사용을 통한 TLS 핸드셰이크 CPU 오버헤드 감소
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # TTFB 단축을 위한 TLS 레코드 버퍼 최적화
    ssl_buffer_size 4k;

    # OCSP Stapling (정식 공인 도메인 인증서 전환 시 주석 해제)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/certs/chain.pem;
    # resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    # resolver_timeout 3s;

    include /etc/nginx/snippets/security-headers.conf;  # 공통 보안 헤더

    # 프록시 기본 타임아웃 (Fast-Fail)
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # 공통 프록시 헤더 및 HTTP/1.1 Keepalive 활성화
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    # WebSocket / Keepalive 동적 제어 헤더
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # 점(.)으로 시작하는 모든 숨김 파일 접근 차단 (.git, .env, .gitkeep 등)
    location ~ /\. {
        deny all;
        access_log off;
    }

    location = /healthz {
        default_type text/plain;
        return 200 'OK';
        access_log off;
    }

    ### 1. Web / SSR

    # 브라우저/크롤러 기본 요청 로그 노이즈 차단

    location = /favicon.ico {
        proxy_pass http://web_service;
        access_log off;
        limit_except GET {
            deny all;
        }
    }

    # 크롤러 정책 파일
    location = /robots.txt {
        proxy_pass http://web_service;
        access_log off;
        limit_except GET {
            deny all;
        }
    }

    location ^~ /_next/static/ {
        proxy_pass http://web_service;
        access_log off;
        limit_except GET {
            deny all;
        }

        proxy_cache NEXT_STATIC;
        proxy_cache_valid 200 365d;

        # Next.js 재기동/배포/장애 시 백엔드 에러 대신 보관 중인 캐시로 자동 대체 (장애 방어막)
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        # [동시성 최적화] 동일 파일 동시 인입 시 최초 1개 요청만 Next.js로 보내고,
        # 나머지 요청은 첫 요청의 캐시 저장이 끝날 때까지 대기했다가 캐시에서 응답
        proxy_cache_lock on;
        proxy_cache_lock_timeout 1s; # 1초 대기 후 캐시 안 되면 즉시 Next.js로 우회
        proxy_cache_lock_age 2s; # 2초 동안 캐시 미생성 시 다음 요청자가 캐시 작성 시도
    }

    location / {
        proxy_pass http://web_service;
    }

    ### 2. Local Disk (공유 볼륨 업로드 정적 파일 서빙)

    # 유저 UUID 프로필 이미지
    location ^~ /uploads/avatars/ {
        root /var/www;
        include /etc/nginx/snippets/security-headers.conf;

        limit_except GET {
            deny all;
        }

        autoindex off;
        try_files $uri =404;

        # 업로드된 파일 내 스크립트 실행 격리 (SVG XSS 등 방어)
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;

        add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
        access_log off;
    }

    # 채팅 일반 첨부파일
    location ^~ /uploads/ {
        root /var/www;
        include /etc/nginx/snippets/security-headers.conf;

        limit_except GET {
            deny all;
        }

        autoindex off;
        try_files $uri =404;

        # 채팅방 내 일반 첨부 이미지, 비디오, 음성 미리보기
        add_header Content-Security-Policy "default-src 'none'; media-src 'self'; img-src 'self'; style-src 'unsafe-inline'; sandbox allow-downloads" always;

        add_header Cache-Control "private, max-age=86400, no-transform" always;
        access_log off;
    }

    ### 3. WebSocket

    # NestJS 실시간 채팅 WebSocket 전용 라우팅 (커넥션 유지 보장)
    location ^~ /socket.io/ {
        proxy_pass http://api_service;
        proxy_read_timeout 3600s; # 1시간 연결 유지
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    ### 4. Backend API

    include /etc/nginx/snippets/json-error-locations.conf;

    # 대용량 파일 업로드 라우트: 버퍼링 해제하여 /tmp 메모리/디스크 고갈 원천 차단
    location ^~ /api/uploads/ {
        proxy_pass http://api_service;
        limit_req zone=upload_limit burst=5 nodelay; # UI 다중 파일 선택 동시 전송 수용
        client_max_body_size 50M;

        # tmpfs 메모리/디스크 쓰기 방지를 위한 실시간 패스스루 스트리밍
        proxy_request_buffering off;

        # 대용량 파일 전송 중 끊김 방지 타임아웃
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        include /etc/nginx/snippets/api-error-pages.conf;
    }

    # LangChain 채팅 요약 SSE 스트리밍
    location ~ ^/api/chats/[^/]+/summary/stream/?$ {
        proxy_pass http://api_service;

        # 고비용 AI 엔드포인트 보호를 위한 전용 Rate Limit
        # 순간적인 1~2회 연속 클릭은 burst=2로 즉시 수용, 초과 시 즉시 429 응답
        limit_req zone=ai_limit burst=2 nodelay;

        client_max_body_size 10M;

        # 실시간 토큰 전송을 위한 버퍼링 완전 비활성화
        proxy_buffering off;

        # 첫 토큰(TTFT) 대기 상한선 (토큰 수신 시마다 타이머 0초로 리셋됨)
        proxy_read_timeout 60s; # 초과시 504 Gateway Timeout 응답

        include /etc/nginx/snippets/api-error-pages.conf;
    }

    # LangChain 회의 태스크 구조화 추출
    location ~ ^/api/chats/[^/]+/tasks/extract/?$ {
        proxy_pass http://api_service;
        limit_req zone=ai_limit burst=2 nodelay;
        client_max_body_size 10M;

        # 온프레미스 환경: RAG 검색 + LLM 랙 + 캘린더 DB 대조 전체 수용 (3분)
        proxy_read_timeout 180s;

        include /etc/nginx/snippets/api-error-pages.conf;
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://api_service;
        limit_req zone=api_limit burst=20 nodelay;

        # 일반 API는 10MB로 제한하여 대용량 공격 방어 (필요 시 파일 업로드(전송) 라우트만 별도 확장)
        client_max_body_size 10M;

        include /etc/nginx/snippets/api-error-pages.conf;
    }
}
